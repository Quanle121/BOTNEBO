<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FOUL</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:Arial;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
.box{background:#151515;padding:30px;border-radius:15px;border:1px solid red;width:340px;box-shadow:0 0 25px rgba(255,0,0,.2)}
h2{color:red;text-align:center;letter-spacing:4px;margin:0 0 25px}
input{width:100%;padding:13px;margin:8px 0;background:#000;border:1px solid #333;color:#fff;border-radius:8px;box-sizing:border-box}
button{width:100%;padding:13px;background:red;border:none;color:#fff;font-weight:bold;border-radius:8px;margin-top:15px;cursor:pointer}
#thongbao{text-align:center;margin-top:12px;font-weight:bold;min-height:20px}
.ok{color:#00ff66} .sai{color:#ffcc00}
#panel{display:none}
.item{display:flex;justify-content:space-between;align-items:center;padding:18px 0;border-bottom:1px solid #222;font-size:14px}
.dot{width:20px;height:20px;border-radius:50%;background:#fff;cursor:pointer}
.dot.active{background:red;box-shadow:0 0 10px red}
</style>
</head>
<body>

<div id="loginBox" class="box">
<h2>FOUL</h2>
<input id="tk" placeholder="Tài khoản">
<input id="mk" type="password" placeholder="Mật khẩu">
<button onclick="login()">ĐĂNG NHẬP</button>
<div id="thongbao"></div>
</div>

<div id="panel" class="box">
<h2>FOUL</h2>
<div class="item"><span>AIMLOCK V2</span><div class="dot" onclick="this.classList.toggle('active')"></div></div>
<div class="item"><span>MAGIC BULLET</span><div class="dot" onclick="this.classList.toggle('active')"></div></div>
<div class="item"><span>AIM 100%</span><div class="dot" onclick="this.classList.toggle('active')"></div></div>
<div class="item"><span>CHAMS V3</span><div class="dot" onclick="this.classList.toggle('active')"></div></div>
<div class="item"><span>RUN FAST</span><div class="dot" onclick="this.classList.toggle('active')"></div></div>
</div>

<script>
function login(){
 let tk=document.getElementById('tk').value.trim();
 let mk=document.getElementById('mk').value.trim();
 let tb=document.getElementById('thongbao');
 let data=JSON.parse(localStorage.getItem('foul_acc')||"[]");

 // TK admin của m - không bao giờ hết hạn
 if(tk==="TNX08-VIP-0xXH8YnMbPQA" && mk==="TNX-0xM9CWbktyuW"){
   tb.className="ok"; tb.innerHTML="bạn đã đăng nhập thành công (ADMIN)";
   setTimeout(()=>{loginBox.style.display='none';panel.style.display='block'},600); return;
 }

 let acc=data.find(a=>a.tk===tk && a.mk===mk);
 if(!acc){
   tb.className="sai"; tb.innerHTML="Bạn đăng nhập tài khoản hoặc mk sai"; return;
 }
 if(Date.now() > acc.expiry){
   tb.className="sai"; tb.innerHTML="Tài khoản đã hết hạn! Vui lòng gia hạn";
   return;
 }
 let conlai=Math.ceil((acc.expiry-Date.now())/86400000);
 tb.className="ok"; tb.innerHTML=`bạn đã đăng nhập thành công - còn ${conlai} ngày`;
 setTimeout(()=>{loginBox.style.display='none';panel.style.display='block'},600);
}
</script>
</body>
</html>
