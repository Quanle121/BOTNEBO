<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FOUL PANEL</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:Arial;padding:20px}
.panel{max-width:400px;margin:auto;background:#151515;border-radius:20px;padding:20px;border:1px solid #ff0033}
h1{text-align:center;color:#ff0033;letter-spacing:2px}
.item{display:flex;justify-content:space-between;align-items:center;padding:15px 0;border-bottom:1px solid #222}
.switch{width:50px;height:26px;background:#333;border-radius:20px;position:relative;cursor:pointer;transition:0.3s}
.switch.on{background:#ff0033}
.knob{width:22px;height:22px;background:#fff;border-radius:50%;position:absolute;top:2px;left:2px;transition:0.3s}
.switch.on .knob{left:26px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#ff0033;padding:10px 20px;border-radius:20px;display:none}
</style>
</head>
<body>
<div class="panel">
<h1>FOUL</h1>
<div class="item"><span>AIMLOCK V2</span><div class="switch" onclick="toggle(this,'AIMLOCK')"><div class="knob"></div></div></div>
<div class="item"><span>MAGIC BULLET</span><div class="switch" onclick="toggle(this,'MAGIC BULLET')"><div class="knob"></div></div></div>
<div class="item"><span>AIM 100%</span><div class="switch" onclick="toggle(this,'AIM 100%')"><div class="knob"></div></div></div>
<div class="item"><span>CHAMS V3</span><div class="switch" onclick="toggle(this,'CHAMS V3')"><div class="knob"></div></div></div>
<div class="item"><span>RUN FAST</span><div class="switch" onclick="toggle(this,'RUN FAST')"><div class="knob"></div></div></div>
</div>
<div id="toast"></div>
<script>
function toggle(el,name){
 el.classList.toggle('on');
 let isOn = el.classList.contains('on');
 let status = isOn ? 'ĐÃ BẬT' : 'ĐÃ TẮT';
 showToast(name + ' ' + status);
 // lưu lại
 localStorage.setItem(name, isOn);
 // âm thanh tạch
 let audio = new Audio('https://cdn.freesound.org/previews/270/270404_5123851-lq.mp3');
 audio.volume = 0.3; audio.play().catch(()=>{});
}
function showToast(text){
 let t=document.getElementById('toast');
 t.innerText=text; t.style.display='block';
 setTimeout(()=>t.style.display='none',1500);
}
// load lại trạng thái cũ
window.onload=()=>{
 document.querySelectorAll('.item').forEach(item=>{
   let name=item.querySelector('span').innerText;
   if(localStorage.getItem(name)=='true'){
     item.querySelector('.switch').classList.add('on');
   }
 });
}
</script>
</body>
</html>
