<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOUL PANEL VIP</title>
<style>
body{background:#050505;color:#fff;font-family:Arial;margin:0}
.login{display:flex;justify-content:center;align-items:center;height:100vh}
.box{background:#111;padding:35px;border-radius:15px;border:1px solid red;width:320px;box-shadow:0 0 20px red;text-align:center}
input{width:100%;padding:12px;margin:8px 0;background:#000;border:1px solid #333;color:#fff;border-radius:6px;box-sizing:border-box}
button{width:100%;padding:12px;background:red;color:#fff;border:none;border-radius:6px;font-weight:bold;cursor:pointer;margin-top:10px}
#tb{margin-top:12px;font-weight:bold;min-height:20px}
.panel{display:none;padding:20px;text-align:center}
.card{background:#111;border:1px solid #333;padding:20px;border-radius:10px;margin:10px}
</style>
</head>
<body>

<div id="loginPage" class="login">
<div class="box">
<h2 style="color:red">FOUL LOGIN</h2>
<input id="tk" placeholder="Tài khoản">
<input id="mk" type="password" placeholder="Mật khẩu">
<button onclick="login()">ĐĂNG NHẬP</button>
<div id="tb"></div>
</div>
</div>

<div id="panelPage" class="panel">
<h1 style="color:red">FOUL PANEL - ĐÃ ĐĂNG NHẬP THÀNH CÔNG</h1>
<p>TK: <span id="showTk" style="color:yellow"></span></p>
<div class="card">🔥 AIMBOT: ON | ANTIBAN: ON | VIP: ACTIVE</div>
<div class="card">Chào mừng đến với panel hack của mày</div>
<button onclick="logout()" style="width:200px">ĐĂNG XUẤT</button>
</div>

<script>
function login(){
 let tk=document.getElementById('tk').value.trim();
 let mk=document.getElementById('mk').value.trim();
 let tb=document.getElementById('tb');
 // check vô hạn
 if((tk=="TNX08-VIP-0xXH8YnMbPQA" && mk=="TNX-0xM9CWbktyuW") || (tk.startsWith("TNX08-VIP-") && mk.startsWith("TNX-"))){
   tb.style.color="#00ff00";
   tb.innerHTML="bạn đã đăng nhập thành công";
   setTimeout(()=>{
     document.getElementById('loginPage').style.display='none';
     document.getElementById('panelPage').style.display='block';
     document.getElementById('showTk').innerText=tk;
   },800);
 } else {
   tb.style.color="#ffcc00";
   tb.innerHTML="Bạn đăng nhập tài khoản hoặc mk sai";
 }
}
function logout(){location.reload();}
</script>
</body>
</html>
