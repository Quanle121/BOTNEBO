<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOUL LOGIN</title>
<style>
body{background:#070707;color:#fff;font-family:sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
.box{background:#121212;padding:35px;border-radius:15px;border:1px solid #ff0000;width:320px;box-shadow:0 0 25px rgba(255,0,0,0.5);text-align:center}
input{width:100%;padding:13px;margin:10px 0;background:#000;border:1px solid #333;color:#fff;border-radius:8px;box-sizing:border-box;outline:none}
input:focus{border-color:red}
button{width:100%;padding:13px;background:red;border:none;color:#fff;font-weight:bold;border-radius:8px;margin-top:15px;cursor:pointer;font-size:16px}
#thongbao{margin-top:15px;font-weight:bold;min-height:20px}
.ok{color:#00ff00}
.sai{color:#ffcc00}
</style>
</head>
<body>
<div class="box">
<h2 style="color:red;margin:0 0 20px 0;">FOUL PANEL</h2>
<input id="tk" placeholder="Tài khoản">
<input id="mk" type="password" placeholder="Mật khẩu">
<button onclick="dangnhap()">ĐĂNG NHẬP</button>
<div id="thongbao"></div>
</div>

<script>
// DANH SÁCH TÀI KHOẢN GỐC CỦA MÀY
let tk_goc = "TNX08-VIP-0xXH8YnMbPQA";
let mk_goc = "TNX-0xM9CWbktyuW";

function dangnhap(){
  let tk = document.getElementById('tk').value.trim();
  let mk = document.getElementById('mk').value.trim();
  let tb = document.getElementById('thongbao');

  // LOGIC VÔ HẠN TK: chỉ cần đúng định dạng TNX08-VIP-... và TNX-...
  let hopLe = false;

  // 1. Nếu nhập đúng tài khoản gốc của m
  if(tk === tk_goc && mk === mk_goc){
    hopLe = true;
  }
  // 2. HOẶC bất kỳ tài khoản nào bắt đầu bằng TNX08-VIP- và MK bắt đầu bằng TNX-
  else if(tk.startsWith("TNX08-VIP-") && mk.startsWith("TNX-") && tk.length > 12 && mk.length > 6){
    hopLe = true;
  }

  if(hopLe){
    tb.className = "ok";
    tb.innerHTML = "bạn đã đăng nhập thành công";
    setTimeout(()=>{
      window.location.href = "panel.html";
    }, 1000);
  } else {
    tb.className = "sai";
    tb.innerHTML = "Bạn đăng nhập tài khoản hoặc mk sai";
  }
}
</script>
</body>
</html>
