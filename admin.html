<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADMIN</title>
<style>body{background:#0a0a0a;color:#fff;font-family:Arial;display:flex;justify-content:center;padding:20px}.box{background:#151515;border:1px solid red;padding:25px;border-radius:12px;width:380px}select,button{width:100%;padding:12px;margin:8px 0;background:#000;color:#fff;border:1px solid #333;border-radius:8px}button{background:red;font-weight:bold}.acc{background:#000;border:1px solid #222;padding:10px;margin-top:10px;border-radius:8px;font-size:12px;word-break:break-all}</style></head><body>
<div class="box">
<h2 style="text-align:center;color:red">TAO TK 2 THIET BI</h2>
<select id="days">
<option value="1">1 Ngày</option>
<option value="3">3 Ngày</option>
<option value="7">7 Ngày</option>
<option value="20">20 Ngày</option>
<option value="30">30 Ngày</option>
<option value="90">90 Ngày</option>
<option value="99999">VĨNH VIỄN</option>
</select>
<button onclick="taotk()">TẠO TÀI KHOẢN</button>
<div id="ketqua"></div><div id="list" style="margin-top:15px"></div>
</div>
<script>
function rand(l,p){let c="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789",s="";for(let i=0;i<l;i++)s+=c[Math.floor(Math.random()*c.length)];return p+s;}
function taotk(){let v=document.getElementById('days').value;let tk=rand(12,"TNX08-VIP-0x");let mk=rand(10,"TNX-0x");let expiry,ten;if(v=="99999"){expiry=9999999999999;ten="VĨNH VIỄN";}else{expiry=Date.now()+parseInt(v)*86400000;ten=v+" ngày";}let data=JSON.parse(localStorage.getItem('foul_acc')||"[]");data.push({tk,mk,expiry,days:ten,devices:[]});localStorage.setItem('foul_acc',JSON.stringify(data));ketqua.innerHTML=`<div class=acc style="border-color:red">TK: ${tk}<br>MK: ${mk}<br>HSD: ${ten}</div>`;hienlist();}
function hienlist(){let data=JSON.parse(localStorage.getItem('foul_acc')||"[]");let now=Date.now();let loc=data.filter(a=>a.expiry==9999999999999||now<a.expiry);localStorage.setItem('foul_acc',JSON.stringify(loc));let h="";loc.forEach((a,i)=>{h+=`<div class=acc>${a.tk} | ${a.mk}<br>${a.days} - ${a.devices?a.devices.length:0}/2 TB <button onclick="xoa(${i})" style="padding:3px">Xóa</button> <button onclick="resetTB(${i})" style="padding:3px">Reset TB</button></div>`});list.innerHTML=h||"Trống";}
function xoa(i){let d=JSON.parse(localStorage.getItem('foul_acc')||"[]");d.splice(i,1);localStorage.setItem('foul_acc',JSON.stringify(d));hienlist();}
function resetTB(i){let d=JSON.parse(localStorage.getItem('foul_acc')||"[]");d[i].devices=[];localStorage.setItem('foul_acc',JSON.stringify(d));hienlist();}
hienlist();
</script></body></html>
