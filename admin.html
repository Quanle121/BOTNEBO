<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADMIN</title>
<style>body{background:#0a0a0a;color:#fff;font-family:Arial;display:flex;justify-content:center;padding:20px}
.box{background:#151515;border:1px solid red;padding:25px;border-radius:12px;width:400px}
button,select{width:100%;padding:12px;margin:8px 0;background:#000;color:#fff;border:1px solid #333;border-radius:8px}
button{background:red;font-weight:bold}
.acc{background:#000;border:1px solid #222;padding:10px;margin-top:10px;border-radius:8px;font-size:12px;word-break:break-all}
</style></head><body>
<div class="box">
<h2 style="text-align:center;color:red">TẠO TK 2 THIẾT BỊ</h2>
<select id="days"><option value="1">1 Ngày</option><option value="3">3 Ngày</option><option value="7">7 Ngày</option><option value="30">30 Ngày</option><option value="90">90 Ngày</option></select>
<button onclick="taotk()">TẠO TK</button>
<div id="ketqua"></div>
<div id="list"></div>
</div>
<script>
function rand(l,p){let c="ABCDEF...0123456789",s="";c="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";for(let i=0;i<l;i++)s+=c[Math.floor(Math.random()*c.length)];return p+s;}
function taotk(){let d=parseInt(days.value);let tk=rand(14,"TNX08-VIP-0x");let mk=rand(12,"TNX-0x");let expiry=Date.now()+d*86400000;let data=JSON.parse(localStorage.getItem('foul_acc')||"[]");data.push({tk,mk,expiry,days:d,devices:[]});localStorage.setItem('foul_acc',JSON.stringify(data));ketqua.innerHTML=`<div class=acc>TK: ${tk}<br>MK: ${mk}<br>${d} ngày - 2 thiết bị</div>`;hienlist();}
function hienlist(){let data=JSON.parse(localStorage.getItem('foul_acc')||"[]");let now=Date.now();data=data.filter(a=>now<a.expiry);localStorage.setItem('foul_acc',JSON.stringify(data));let h="";data.forEach((a,i)=>{h+=`<div class=acc>${a.tk}<br>${a.mk}<br>Hạn: ${a.days} ngày - Đã dùng: ${a.devices?a.devices.length:0}/2 TB<br><button onclick="xoa(${i})" style="background:#333;padding:5px">Xóa</button> <button onclick="resetTB(${i})" style="background:#333;padding:5px">Reset TB</button></div>`});list.innerHTML=h;}
function xoa(i){let d=JSON.parse(localStorage.getItem('foul_acc')||"[]");d.splice(i,1);localStorage.setItem('foul_acc',JSON.stringify(d));hienlist();}
function resetTB(i){let d=JSON.parse(localStorage.getItem('foul_acc')||"[]");d[i].devices=[];localStorage.setItem('foul_acc',JSON.stringify(d));hienlist();}
setInterval(hienlist,3000);hienlist();
</script></body></html>
