<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FOUL ADMIN</title>
<style>body{background:#0a0a0a;color:#fff;font-family:Arial;display:flex;justify-content:center;padding:20px}
.box{background:#151515;border:1px solid red;padding:25px;border-radius:12px;width:400px}
button,select,input{width:100%;padding:12px;margin:8px 0;background:#000;color:#fff;border:1px solid #333;border-radius:8px}
button{background:red;font-weight:bold;cursor:pointer}
.acc{background:#000;border:1px solid #222;padding:10px;margin-top:10px;border-radius:8px;font-size:13px;word-break:break-all}
span{color:#ff5555}
</style></head><body>
<div class="box">
<h2 style="text-align:center;color:red">FOUL - TẠO TK</h2>
<select id="days">
<option value="1">1 Ngày</option><option value="3">3 Ngày</option>
<option value="7">7 Ngày</option><option value="20">20 Ngày</option>
<option value="30">30 Ngày</option><option value="90">90 Ngày</option>
</select>
<button onclick="taotk()">TẠO TÀI KHOẢN</button>
<div id="ketqua"></div>
<h3 style="margin-top:20px">Danh sách TK:</h3>
<div id="list"></div>
<button onclick="xoahenhan()" style="background:#333;margin-top:15px">Xóa TK đã hết hạn</button>
</div>
<script>
function rand(len,prefix){let c="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";let s="";for(let i=0;i<len;i++)s+=c[Math.floor(Math.random()*c.length)];return prefix+s;}
function taotk(){
 let d=parseInt(document.getElementById('days').value);
 let tk=rand(14,"TNX08-VIP-0x"); let mk=rand(12,"TNX-0x");
 let expiry=Date.now()+d*24*60*60*1000;
 let data=JSON.parse(localStorage.getItem('foul_acc')||"[]");
 data.push({tk,mk,expiry,created:Date.now(),days:d});
 localStorage.setItem('foul_acc',JSON.stringify(data));
 document.getElementById('ketqua').innerHTML=`<div class=acc>Đã tạo:<br>TK: <span>${tk}</span><br>MK: <span>${mk}</span><br>HSD: ${d} ngày - hết hạn: ${new Date(expiry).toLocaleString()}</div>`;
 hienlist();
}
function hienlist(){
 let data=JSON.parse(localStorage.getItem('foul_acc')||"[]");
 let html=""; data.forEach((a,i)=>{
  let con=Date.now()>a.expiry?"<b style=color:red> ĐÃ HẾT HẠN</b>":`Còn ${Math.ceil((a.expiry-Date.now())/86400000)} ngày`;
  html+=`<div class=acc>${a.tk} | ${a.mk}<br>Hạn ${a.days} ngày - ${con} <button onclick="xoa(${i})" style="padding:4px;margin-top:5px">Xóa</button></div>`;
 }); document.getElementById('list').innerHTML=html;
}
function xoa(i){let d=JSON.parse(localStorage.getItem('foul_acc')||"[]");d.splice(i,1);localStorage.setItem('foul_acc',JSON.stringify(d));hienlist();}
function xoahenhan(){let d=JSON.parse(localStorage.getItem('foul_acc')||"[]");d=d.filter(a=>Date.now()<a.expiry);localStorage.setItem('foul_acc',JSON.stringify(d));hienlist();}
hienlist();
</script></body></html>
